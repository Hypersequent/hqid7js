name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  package:
    name: package smoke (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Pack tarball
        run: npm pack

      - name: Global install — CLI smoke test
        run: |
          set -e
          PKG=$(ls hqid7-*.tgz | head -n1)
          npm install -g "./$PKG"

          EXPECTED=$(node -p "require('./package.json').version")
          test "$(hqid7 --version)" = "$EXPECTED" || { echo "version mismatch"; exit 1; }

          ID=$(hqid7 new)
          echo "generated: $ID"
          test ${#ID} -eq 23 || { echo "expected 23-char id, got '$ID'"; exit 1; }
          hqid7 parse "$ID" > /dev/null

      - name: Local install — library import smoke test
        run: |
          set -e
          PKG=$(ls hqid7-*.tgz | head -n1)
          tmp=$(mktemp -d)
          cp mnode-test/lib-smoke.mjs "$tmp/"
          cd "$tmp"
          npm init -y > /dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/$PKG" > /dev/null 2>&1
          node lib-smoke.mjs

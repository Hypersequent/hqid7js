name: Publish

# Publishes to npm on a version tag (e.g. `git tag v0.1.1 && git push --tags`).
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN required. One-time setup on
# npmjs.com: package → Settings → Trusted Publisher → GitHub Actions, with
# org `Hypersequent`, repo `hqid7js`, and workflow filename `publish.yml`.
# Provenance is attached automatically.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1; ensure it regardless of
      # what the Node release bundles.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Guard: the tag must match the package.json version, so we never publish
      # a mismatched version.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm publish
